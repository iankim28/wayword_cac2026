<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wayword</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="sim-page">
    <div class="stage">
      <div class="phone">
        <header class="top">
          <p class="brand">Wayword</p>
        </header>
        <main id="screen"></main>
        <nav class="tabs" aria-label="Screens">
          <button type="button" data-tab="talk">Talk</button>
          <button type="button" data-tab="result">Result</button>
          <button type="button" data-tab="history">History</button>
        </nav>
      </div>
    </div>
    <script src="record.js"></script>
    <script src="app.js"></script>
  </body>
</html>
